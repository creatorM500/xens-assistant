<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Xens Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030308;
  --text: #e8e8f0;
  --dim: #6b6b8a;
  --muted: #48486a;
  --cyan: #00d4ff;
  --purple: #7c5cfc;
  --accent: #00d4ff;
  --radius: 12px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); }

/* Canvas background */
#nanobots {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* Scan line overlay */
#scanlines {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 212, 255, 0.015) 2px,
    rgba(0, 212, 255, 0.015) 4px
  );
}

/* App UI layer */
.app {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
}

/* HUD Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  flex-shrink: 0;
  background: rgba(3, 3, 8, 0.6);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0, 212, 255, 0.08);
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.logo {
  width: 30px; height: 30px;
  border-radius: 6px;
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px; color: #000;
  box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
}
.title {
  font-size: 14px; font-weight: 600;
  letter-spacing: 0.3px;
}
.title span { color: var(--dim); font-weight: 400; }
.status {
  font-size: 10px; color: var(--dim);
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; padding: 4px 10px;
  border-radius: 20px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.04);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
  animation: pulse 2s infinite;
}
.dot.offline { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, 0.5); animation: none; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

/* Chat */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}
.chat::-webkit-scrollbar { width: 3px; }
.chat::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.15); border-radius: 999px; }
.chat::-webkit-scrollbar-track { background: transparent; }

.msg {
  display: flex;
  gap: 10px;
  max-width: 820px;
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-user { flex-direction: row-reverse; align-self: flex-end; }
.msg-assist { align-self: flex-start; }

.avatar {
  width: 28px; height: 28px;
  border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  backdrop-filter: blur(8px);
}
.msg-assist .avatar {
  background: rgba(124, 92, 252, 0.12);
  border: 1px solid rgba(124, 92, 252, 0.15);
  color: var(--purple);
  box-shadow: 0 0 20px rgba(124, 92, 252, 0.05);
}
.msg-user .avatar {
  background: rgba(0, 212, 255, 0.12);
  border: 1px solid rgba(0, 212, 255, 0.15);
  color: var(--cyan);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.05);
}

.bubble {
  padding: 10px 16px;
  border-radius: var(--radius);
  font-size: 13.5px;
  line-height: 1.65;
  overflow-wrap: break-word;
  word-break: break-word;
}
.msg-assist .bubble {
  background: rgba(10, 10, 24, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-top-left-radius: 4px;
  backdrop-filter: blur(16px);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
}
.msg-user .bubble {
  background: rgba(0, 212, 255, 0.04);
  border: 1px solid rgba(0, 212, 255, 0.08);
  border-top-right-radius: 4px;
  white-space: pre-wrap;
  font-size: 13px;
}

.bubble p { margin: 6px 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child { margin-bottom: 0; }
.bubble ul, .bubble ol { padding-left: 20px; margin: 6px 0; }
.bubble li { margin: 2px 0; }
.bubble blockquote { border-left: 3px solid var(--purple); padding-left: 12px; margin: 8px 0; color: var(--dim); }
.bubble table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; width: 100%; }
.bubble th, .bubble td { border: 1px solid rgba(255,255,255,0.06); padding: 6px 10px; text-align: left; }
.bubble th { background: rgba(0,0,0,0.2); }
.bubble a { color: var(--cyan); text-decoration: none; }
.bubble a:hover { text-decoration: underline; }
.bubble code {
  font-size: 12.5px;
  background: rgba(0, 212, 255, 0.06);
  padding: 2px 5px; border-radius: 4px;
  font-family: var(--mono);
}
.bubble pre {
  background: rgba(0, 0, 0, 0.5);
  padding: 12px 14px; border-radius: 8px;
  font-size: 12.5px; overflow-x: auto;
  margin: 8px 0;
  border: 1px solid rgba(0, 212, 255, 0.06);
  position: relative;
}
.bubble pre code { background: none; padding: 0; border-radius: 0; font-size: inherit; }
.bubble pre .copy-btn {
  position: absolute; top: 6px; right: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.04);
  color: var(--dim);
  padding: 2px 8px; border-radius: 4px;
  font-size: 10px; cursor: pointer;
  font-family: var(--font);
  transition: all .15s;
}
.bubble pre .copy-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.bubble h1, .bubble h2, .bubble h3, .bubble h4 { margin: 10px 0 4px; color: var(--text); }
.bubble h1 { font-size: 16px; font-weight: 600; }
.bubble h2 { font-size: 14.5px; font-weight: 600; }
.bubble h3 { font-size: 13.5px; font-weight: 600; }
.bubble hr { border: none; border-top: 1px solid rgba(255,255,255,0.04); margin: 10px 0; }
.bubble img { max-width: 100%; border-radius: 6px; }

/* Input */
.input-wrap {
  display: flex;
  gap: 8px;
  padding: 14px 24px 18px;
  flex-shrink: 0;
  align-items: flex-end;
  background: rgba(3, 3, 8, 0.6);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(0, 212, 255, 0.06);
}
.input-wrap textarea {
  flex: 1;
  background: rgba(10, 10, 24, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.04);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  outline: none;
  resize: none;
  min-height: 40px;
  max-height: 120px;
  line-height: 1.4;
  transition: border .2s;
}
.input-wrap textarea:focus {
  border-color: rgba(0, 212, 255, 0.2);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.03);
}
.input-wrap button {
  background: linear-gradient(135deg, var(--cyan), var(--purple));
  border: none;
  color: #000;
  padding: 10px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: var(--font);
  transition: all .2s;
  height: 40px;
  letter-spacing: 0.3px;
}
.input-wrap button:hover {
  box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
  transform: translateY(-1px);
}
.input-wrap button:disabled {
  opacity: .35;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

/* Typing indicator */
.typing {
  display: flex;
  gap: 5px;
  padding: 8px 0 4px 38px;
  align-items: center;
}
.typing .d {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--purple);
  animation: tyB 1.4s infinite;
  box-shadow: 0 0 6px rgba(124, 92, 252, 0.3);
}
.typing .d:nth-child(2) { animation-delay: .2s; }
.typing .d:nth-child(3) { animation-delay: .4s; }
@keyframes tyB { 0%,60%,100%{transform:translateY(0);opacity:.3} 30%{transform:translateY(-5px);opacity:.9} }

/* Tool messages */
.tool-msg { align-self: flex-start; margin-left: 38px; animation: fadeIn 0.2s ease; }
.tool-name { font-size: 11px; color: var(--cyan); font-family: var(--mono); }
.tool-args { font-size: 11px; color: var(--dim); }
.tool-status { font-size: 10px; padding: 1px 8px; border-radius: 3px; background: rgba(255,255,255,0.03); font-family: var(--mono); }
.tool-status.running { color: var(--cyan); }
.tool-status.ok { color: #22c55e; }
.tool-status.fail { color: #ef4444; }

/* Screenshot images */
.screenshot-wrap { padding: 4px 0; }
.screenshot-wrap img {
  max-width: 360px;
  border-radius: 8px;
  border: 1px solid rgba(0, 212, 255, 0.06);
  box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
}
.screenshot-meta { font-size: 9px; color: var(--muted); margin-top: 2px; letter-spacing: 0.5px; text-transform: uppercase; font-family: var(--mono); }

.hidden { display: none; }

.scroll-btn {
  position: fixed; bottom: 80px; right: 24px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(10,10,24,0.6);
  border: 1px solid rgba(0,212,255,0.08);
  color: var(--dim);
  cursor: pointer;
  display: none;
  align-items: center; justify-content: center;
  font-size: 14px;
  transition: all .2s;
  z-index: 5;
  backdrop-filter: blur(8px);
}
.scroll-btn:hover { color: var(--text); border-color: var(--cyan); box-shadow: 0 0 20px rgba(0,212,255,0.05); }
.scroll-btn.visible { display: flex; }
</style>
</head>
<body>
<canvas id="nanobots"></canvas>
<div id="scanlines"></div>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="logo">X</div>
      <span class="title">Xens <span>assistant</span></span>
      <span class="status" id="status" title="Click to reconnect">
        <span class="dot" id="statusDot"></span>connected
      </span>
    </div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="typing hidden" id="typing"><div class="d"></div><div class="d"></div><div class="d"></div></div>
  <button class="scroll-btn" id="scrollBtn">&darr;</button>
  <div class="input-wrap">
    <textarea id="input" placeholder="Message Xens..." rows="1" autocomplete="off"></textarea>
    <button id="send">Send</button>
  </div>
</div>

<script>
// ============================================================
// NANOBOT PARTICLE SYSTEM
// ============================================================
const canvas = document.getElementById('nanobots');
const ctx = canvas.getContext('2d');
let W, H;
let particles = [];
const PARTICLE_COUNT = 180;
const CONNECTION_DIST = 110;
const MOUSE_RADIUS = 140;
let mouse = { x: -9999, y: -9999, active: false };
let time = 0;

class Nanobot {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.8;
    this.vy = (Math.random() - 0.5) * 0.8;
    this.size = 2 + Math.random() * 3;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = 0.3 + Math.random() * 0.4;
    this.targetX = W / 2 + (Math.random() - 0.5) * W * 0.4;
    this.targetY = H / 2 + (Math.random() - 0.5) * H * 0.4;
    this.hexPoints = this._genHex(this.size);
  }
  _genHex(s) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 6;
      pts.push({ x: Math.cos(a) * s * 0.8, y: Math.sin(a) * s * 0.8 });
    }
    return pts;
  }
  update() {
    time += 0.003;
    // Attraction to home region
    const dx = this.targetX - this.x;
    const dy = this.targetY - this.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 10) {
      this.vx += (dx / dist) * 0.003;
      this.vy += (dy / dist) * 0.003;
    }
    // Mouse repel
    const mdx = this.x - mouse.x;
    const mdy = this.y - mouse.y;
    const mdist = Math.hypot(mdx, mdy);
    if (mdist < MOUSE_RADIUS && mdist > 1) {
      const force = (MOUSE_RADIUS - mdist) / MOUSE_RADIUS;
      this.vx += (mdx / mdist) * force * 0.4;
      this.vy += (mdy / mdist) * force * 0.4;
    }
    // Damping
    this.vx *= 0.96;
    this.vy *= 0.96;
    // Speed cap
    const spd = Math.hypot(this.vx, this.vy);
    if (spd > 2) { this.vx = (this.vx / spd) * 2; this.vy = (this.vy / spd) * 2; }
    this.x += this.vx;
    this.y += this.vy;
    // Wrap edges with soft boundary
    const margin = 60;
    if (this.x < -margin) this.x = W + margin;
    if (this.x > W + margin) this.x = -margin;
    if (this.y < -margin) this.y = H + margin;
    if (this.y > H + margin) this.y = -margin;
  }
  draw() {
    const pulse = 0.85 + 0.15 * Math.sin(time * 2 + this.phase);
    const cx = this.x;
    const cy = this.y;
    // Outer glow
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, this.size * 3 * pulse);
    grad.addColorStop(0, `rgba(0, 212, 255, ${0.15 * pulse})`);
    grad.addColorStop(1, 'rgba(0, 212, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, this.size * 3 * pulse, 0, Math.PI * 2);
    ctx.fill();
    // Hex shape
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(time * 0.5 + this.phase);
    ctx.beginPath();
    const pts = this.hexPoints;
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < 6; i++) ctx.lineTo(pts[i].x * pulse, pts[i].y * pulse);
    ctx.closePath();
    ctx.strokeStyle = `rgba(0, 212, 255, ${0.25 + 0.2 * pulse})`;
    ctx.lineWidth = 0.6;
    ctx.stroke();
    // Inner fill
    ctx.fillStyle = `rgba(0, 212, 255, ${0.04 + 0.03 * pulse})`;
    ctx.fill();
    // Core dot
    ctx.beginPath();
    ctx.arc(0, 0, 1.2 * pulse, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0, 212, 255, ${0.6 * pulse})`;
    ctx.fill();
    ctx.restore();
  }
}

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = new Nanobot();
    p.targetX = W / 2 + (Math.random() - 0.5) * W * 0.6;
    p.targetY = H / 2 + (Math.random() - 0.5) * H * 0.4;
    // Some particles form a cluster near center
    if (i < PARTICLE_COUNT * 0.4) {
      p.targetX = W / 2 + (Math.random() - 0.5) * 120;
      p.targetY = H / 2 + (Math.random() - 0.5) * 80;
    }
    particles.push(p);
  }
}

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  initParticles();
}

function drawConnections() {
  for (let i = 0; i < particles.length; i++) {
    const a = particles[i];
    for (let j = i + 1; j < particles.length; j++) {
      const b = particles[j];
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      const dist = Math.hypot(dx, dy);
      if (dist < CONNECTION_DIST) {
        const alpha = (1 - dist / CONNECTION_DIST) * 0.12;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.strokeStyle = `rgba(0, 212, 255, ${alpha})`;
        ctx.lineWidth = 0.3;
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  drawConnections();
  particles.forEach(p => { p.update(); p.draw(); });
  // Center glow
  const cg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 200);
  cg.addColorStop(0, 'rgba(0, 212, 255, 0.03)');
  cg.addColorStop(0.5, 'rgba(124, 92, 252, 0.015)');
  cg.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = cg;
  ctx.fillRect(0, 0, W, H);
  requestAnimationFrame(animate);
}

window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; mouse.active = false; });
window.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouse.x = t.clientX; mouse.y = t.clientY;
  mouse.active = true;
}, { passive: true });
window.addEventListener('touchend', () => { mouse.x = -9999; mouse.y = -9999; mouse.active = false; });

resize();
animate();

// ============================================================
// CHAT INTERFACE
// ============================================================
const WS_URL = 'ws://127.0.0.1:18000/ws';
let ws, chatEl = document.getElementById('chat'), inputEl = document.getElementById('input');
let typingEl = document.getElementById('typing'), sendBtn = document.getElementById('send');
let statusDot = document.getElementById('statusDot'), statusEl = document.getElementById('status');
let scrollBtn = document.getElementById('scrollBtn');
let streaming = false;

function connect() {
  if (ws) try { ws.close(); } catch(e) {}
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { statusDot.className = 'dot'; statusEl.childNodes[1].textContent = 'connected'; };
  ws.onclose = () => { statusDot.className = 'dot offline'; statusEl.childNodes[1].textContent = 'disconnected'; setTimeout(connect, 2000); };
  ws.onmessage = handleMessage;
  ws.onerror = () => {};
}

function handleMessage(e) {
  let data;
  try { data = JSON.parse(e.data); } catch { return; }

  if (data.type === 'content') {
    let last = chatEl.lastElementChild;
    if (last && last.classList.contains('msg-assist') && streaming) {
      let bubble = last.querySelector('.bubble');
      bubble.textContent += data.content;
      renderMarkdown(bubble);
    } else {
      appendMsg('assist', data.content, true);
    }
    chatEl.scrollTop = chatEl.scrollHeight;
  } else if (data.type === 'done') {
    streaming = false;
    typingEl.classList.add('hidden');
    sendBtn.disabled = false;
    inputEl.disabled = false;
    inputEl.focus();
  } else if (data.type === 'error') {
    streaming = false;
    typingEl.classList.add('hidden');
    sendBtn.disabled = false;
    inputEl.disabled = false;
    appendMsg('assist', 'Error: ' + data.content);
  } else if (data.type === 'cleared') {
    chatEl.innerHTML = '';
    streaming = false;
    typingEl.classList.add('hidden');
    sendBtn.disabled = false;
    inputEl.disabled = false;
  } else if (data.type === 'ping') {
    ws.send(JSON.stringify({type: 'pong'}));
  } else if (data.type === 'profile') {
  } else if (data.type === 'tool_call') {
    let name = data.name;
    let args = data.args || {};
    let argStr = Object.entries(args).filter(([k,v]) => v != null).map(([k,v]) => k+'='+v).join(', ');
    appendToolCall(name, argStr);
    chatEl.scrollTop = chatEl.scrollHeight;
  } else if (data.type === 'tool_result') {
    let name = data.name;
    let ok = data.success;
    let last = chatEl.lastElementChild;
    if (last && last.classList.contains('tool-msg')) {
      let bubble = last.querySelector('.tool-status');
      if (bubble) {
        bubble.textContent = ok ? 'done' : 'failed';
        bubble.className = 'tool-status ' + (ok ? 'ok' : 'fail');
      }
    }
    chatEl.scrollTop = chatEl.scrollHeight;
  } else if (data.type === 'screenshot') {
    appendScreenshot(data.base64, data.width, data.height);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
}

function appendToolCall(name, args) {
  let div = document.createElement('div');
  div.className = 'msg tool-msg';
  div.innerHTML = '<div style="display:flex;align-items:center;gap:10px;padding:4px 0">'
    + '<span style="color:var(--accent);font-size:13px">&#9889;</span>'
    + '<span class="tool-name">' + name + '</span>'
    + '<span class="tool-args">(' + args + ')</span>'
    + '<span class="tool-status running">running...</span>'
    + '</div>';
  chatEl.appendChild(div);
}

function appendScreenshot(b64, w, h) {
  let div = document.createElement('div');
  div.className = 'msg tool-msg';
  div.innerHTML = '<div class="screenshot-wrap">'
    + '<img src="data:image/jpeg;base64,' + b64 + '">'
    + '<div class="screenshot-meta">screen &#183; ' + w + 'x' + h + '</div>'
    + '</div>';
  chatEl.appendChild(div);
}

function appendMsg(role, text, isStreaming) {
  let div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'msg-user' : 'msg-assist');
  let avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'U' : 'X';
  let content = document.createElement('div');
  let bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (!isStreaming) {
    bubble.innerHTML = renderText(text);
  } else {
    bubble.textContent = text;
  }
  content.appendChild(bubble);
  div.appendChild(avatar);
  div.appendChild(content);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function renderText(text) {
  let html = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    lang = lang || 'plaintext';
    let encoded = code;
    return '<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code class="language-' + lang + '">' + encoded + '</code></pre>';
  });
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  let parts = html.split(/\n\n+/);
  html = parts.map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('<pre>') || p.startsWith('<') && !p.startsWith('<strong') && !p.startsWith('<em') && !p.startsWith('<code')) return p;
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  return html;
}

function renderMarkdown(bubble) {
  let text = bubble.textContent || '';
  bubble.innerHTML = renderText(text);
}

function copyCode(btn) {
  let code = btn.parentElement.querySelector('code');
  let text = code.textContent || code.innerText || '';
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
  });
}

function send() {
  let text = inputEl.value.trim();
  if (!text || !ws || streaming) return;
  appendMsg('user', text, false);
  ws.send(JSON.stringify({type: 'message', text: text}));
  inputEl.value = '';
  inputEl.style.height = 'auto';
  streaming = true;
  typingEl.classList.remove('hidden');
  sendBtn.disabled = true;
  inputEl.disabled = true;
}

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
inputEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);
chatEl.addEventListener('scroll', () => {
  let threshold = 200;
  scrollBtn.classList.toggle('visible', chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight > threshold);
});
scrollBtn.addEventListener('click', () => { chatEl.scrollTop = chatEl.scrollHeight; });
statusEl.addEventListener('click', () => { connect(); });

connect();
</script>
</body>
</html>
